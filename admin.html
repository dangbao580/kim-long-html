<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quản trị sản phẩm | Kim Long Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink:#182725; --muted:#6c7d78; --paper:#fffdf9; --cream:#f7f4ed; --mint:#d8eee4; --green:#0c7662; --coral:#e96f52; --line:#dfe7e2; }
        * { box-sizing:border-box; }
        body { margin:0; color:var(--ink); background:var(--cream); font-family:'DM Sans',sans-serif; }
        header { background:var(--paper); border-bottom:1px solid var(--line); }
        nav, main { max-width:1180px; margin:auto; }
        nav { padding:20px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
        .brand { color:var(--ink); text-decoration:none; font-weight:800; font-size:20px; }
        .brand span { display:block; color:var(--muted); font-size:11px; font-weight:500; letter-spacing:1px; text-transform:uppercase; }
        nav a:last-child { color:var(--green); font-weight:700; text-decoration:none; }
        main { padding:42px 28px 70px; }
        .intro { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:25px; }
        h1 { margin:0 0 8px; font-size:clamp(32px,5vw,52px); line-height:1; }
        .intro p { margin:0; color:var(--muted); }
        .layout { display:grid; grid-template-columns:minmax(300px,.75fr) minmax(0,1.25fr); gap:22px; align-items:start; }
        .panel { padding:24px; border:1px solid var(--line); border-radius:12px; background:var(--paper); }
        .panel h2 { margin:0 0 20px; font-size:22px; }
        .field { margin-bottom:15px; }
        label { display:block; margin-bottom:6px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
        input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:7px; color:var(--ink); background:#fff; font:inherit; }
        input:focus { outline:2px solid var(--mint); border-color:var(--green); }
        .actions { display:flex; gap:9px; margin-top:20px; }
        button { padding:11px 15px; border:0; border-radius:7px; cursor:pointer; font:700 14px 'DM Sans',sans-serif; }
        .primary { color:#fff; background:var(--green); }
        .secondary { color:var(--ink); background:var(--mint); }
        .danger { color:#a63f2a; background:#fde8e2; }
        .status { min-height:20px; margin-top:15px; color:var(--muted); font-size:13px; line-height:1.45; }
        .product-row { display:grid; grid-template-columns:66px minmax(0,1fr) auto; gap:13px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
        .product-row:first-of-type { padding-top:0; }
        .product-row:last-child { border-bottom:0; }
        .thumb { width:66px; height:66px; border-radius:8px; background-position:center; background-size:cover; }
        .product-row strong, .product-row small { display:block; }
        .product-row strong { margin-bottom:4px; }
        .product-row small { color:var(--muted); line-height:1.4; }
        .row-actions { display:flex; gap:6px; }
        .row-actions button { padding:8px 10px; font-size:12px; }
        @media(max-width:800px) { nav, main { padding-left:18px; padding-right:18px; } .layout { grid-template-columns:1fr; } .intro { display:block; } .intro nav { margin-top:15px; } }
        @media(max-width:520px) { .product-row { grid-template-columns:52px minmax(0,1fr); } .thumb { width:52px; height:52px; } .row-actions { grid-column:2; } }
    </style>
</head>
<body>
    <header><nav><a class="brand" href="index.html">Kim Long Trading<span>Quản trị sản phẩm</span></a><a href="index.html">← Xem trang bán hàng</a></nav></header>
    <main>
        <div class="intro"><div><h1>Kho sản phẩm</h1><p>Thêm, sửa hoặc xoá sản phẩm.</p></div></div>
        <div class="layout">
            <form class="panel" id="product-form">
                <h2 id="form-title">Thêm sản phẩm</h2>
                <input id="product-id" type="hidden">
                <div class="field"><label for="image">Ảnh</label><input id="image" required placeholder="https://... hoặc images/snack.jpg"></div>
                <div class="field"><label for="name">Tên sản phẩm</label><input id="name" required></div>
                <div class="field"><label for="category">Loại</label><input id="category" required placeholder="Bánh, Kẹo, Nước..."></div>
                <div class="field"><label for="brand">Thương hiệu</label><input id="brand" required></div>
                <div class="field"><label for="price">Giá tiền (VNĐ)</label><input id="price" type="number" min="0" required></div>
                <div class="actions"><button class="primary" type="submit">Lưu sản phẩm</button><button class="secondary" type="button" id="cancel-button">Huỷ sửa</button></div>
            </form>
            <section class="panel"><h2>Danh sách hiện tại</h2><div class="status" id="status" aria-live="polite"></div><div id="product-list">Đang tải dữ liệu...</div></section>
        </div>
    </main>
    <script>
        const GITHUB_REPOSITORY = 'dangbao580/kim-long-html';
        const GITHUB_BRANCH = 'main';
        const GITHUB_TOKEN = '11112222333';
        const state = { products: [], sha: '', editingId: null };
        const fields = ['image', 'name', 'category', 'brand', 'price'];
        const get = id => document.getElementById(id);
        const status = message => { get('status').textContent = message; };
        const headers = () => ({ Accept: 'application/vnd.github+json', Authorization: `Bearer ${GITHUB_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28' });
        const apiUrl = () => `https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/products.json?ref=${encodeURIComponent(GITHUB_BRANCH)}`;
        const safe = value => String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' })[character]);
        async function githubRequest(method, body) { const response = await fetch(apiUrl(), { method, headers: headers(), body: body ? JSON.stringify(body) : undefined }); const result = await response.json(); if (!response.ok) throw new Error(result.message || 'GitHub API trả về lỗi.'); return result; }
        async function loadProducts() { try { status('Đang tải products.json...'); const result = await githubRequest('GET'); state.sha = result.sha; state.products = JSON.parse(decodeURIComponent(escape(atob(result.content.replace(/\n/g, ''))))); renderList(); status(`Đã tải ${state.products.length} sản phẩm.`); } catch (error) { status(error.message); } }
        function renderList() { get('product-list').innerHTML = state.products.length ? state.products.map(product => `<article class="product-row"><div class="thumb" style="background-image:url('${safe(product.image)}')"></div><div><strong>${safe(product.name)}</strong><small>${safe(product.brand)} · ${safe(product.category)} · ${new Intl.NumberFormat('vi-VN').format(product.price)}đ</small></div><div class="row-actions"><button class="secondary" data-edit="${product.id}">Sửa</button><button class="danger" data-delete="${product.id}">Xoá</button></div></article>`).join('') : '<p>Chưa có sản phẩm.</p>'; }
        function resetForm() { state.editingId = null; get('product-form').reset(); get('form-title').textContent = 'Thêm sản phẩm'; }
        async function saveProducts(message) { const content = btoa(unescape(encodeURIComponent(JSON.stringify(state.products, null, 2) + '\n'))); const result = await githubRequest('PUT', { message, content, sha: state.sha, branch: GITHUB_BRANCH }); state.sha = result.content.sha; status('Đã lưu thành công.'); }
        get('cancel-button').addEventListener('click', resetForm);
        get('product-form').addEventListener('submit', async event => { event.preventDefault(); try { const product = { id: state.editingId || Date.now(), image: get('image').value.trim(), name: get('name').value.trim(), category: get('category').value.trim(), label: get('category').value.trim(), brand: get('brand').value.trim(), price: Number(get('price').value) }; if (!product.image || !product.name || !product.category || !product.brand || !Number.isFinite(product.price)) throw new Error('Vui lòng điền đủ thông tin hợp lệ.'); const index = state.products.findIndex(item => item.id === state.editingId); if (index >= 0) state.products[index] = product; else state.products.push(product); await saveProducts(index >= 0 ? `Sửa sản phẩm: ${product.name}` : `Thêm sản phẩm: ${product.name}`); renderList(); resetForm(); } catch (error) { status(error.message); } });
        get('product-list').addEventListener('click', async event => { const id = Number(event.target.dataset.edit || event.target.dataset.delete); if (!id) return; const product = state.products.find(item => item.id === id); if (event.target.dataset.edit) { state.editingId = id; fields.forEach(field => get(field).value = product[field]); get('form-title').textContent = 'Sửa sản phẩm'; window.scrollTo({ top: 0, behavior: 'smooth' }); return; } if (!confirm(`Xoá sản phẩm “${product.name}”?`)) return; try { state.products = state.products.filter(item => item.id !== id); await saveProducts(`Xoá sản phẩm: ${product.name}`); renderList(); } catch (error) { status(error.message); } });
        loadProducts();
    </script>
</body>
</html>
